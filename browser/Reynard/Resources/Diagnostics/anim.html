<!doctype html>
<html><meta charset="utf-8"><body style="margin:0;overflow:hidden;background:#111">
<div id="m" style="position:absolute;width:100%;height:100%;
background:linear-gradient(45deg,#f00,#0f0,#00f,#f0f);will-change:transform"></div>
<script>
var m = document.getElementById('m');
var f = 0;
setInterval(function () {
  f += 3;
  m.style.transform = 'translateX(' + (Math.sin(f * Math.PI / 180) * 30) + 'px) rotate(' + (f % 360) + 'deg) scale(1.02)';
}, 33);
</script></body></html>
