<!doctype html>
<html><meta charset="utf-8"><body style="background:#fff;font-size:44px">
<pre id="out">running...</pre>
<script>
function work(n){
  var x = 1, y = 2, z = 3;
  for (var i = 0; i < n; i++) { x = (x * 31 + y) | 0; y = (y ^ z) + i | 0; z = (z + x) | 0; }
  return (x ^ y ^ z) | 0;
}
// No warmup on purpose: phase 1 pays tier-up if the JIT backend is on
// (later phases should be far faster); flat runs mean interpreter-only.
var runs = [];
for (var p = 0; p < 4; p++) {
  var t0 = Date.now();
  var acc = 0;
  for (var r = 0; r < 150; r++) acc ^= work(20000);
  runs.push(Date.now() - t0);
}
document.getElementById('out').textContent =
  'JIT-BENCH RUNS[' + runs.join(',') + ']\n' + (navigator.userAgent || '');
</script></body></html>
