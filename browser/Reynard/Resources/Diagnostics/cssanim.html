<!doctype html>
<html><meta charset="utf-8"><body style="margin:0;overflow:hidden;background:#111">
<div id="m" style="position:absolute;width:100%;height:100%;
background:linear-gradient(45deg,#f00,#0f0,#00f,#f0f);will-change:transform;
animation: drift 2s linear infinite"></div>
<style>
@keyframes drift {
  0% { transform: translateX(-30px) rotate(0deg) scale(1.02); }
  50% { transform: translateX(30px) rotate(180deg) scale(1.02); }
  100% { transform: translateX(-30px) rotate(360deg) scale(1.02); }
}
</style></body></html>
